name: snapshot-update

# Daily global baseline for the ?rising overview: one bulk request captures
# every station's current W value into a month-sharded snapshot on the
# `archive` branch (archive/snapshots/YYYY-MM.json — the REST API has no bulk
# history, so yesterday's values must be accumulated here). Same infra pattern
# as archive-update.yml: a push to the orphan data branch cannot trigger
# pages.yml, so the deploy is dispatched explicitly. The shared concurrency
# group serializes against the monthly archive-update run — both push to the
# same branch, and a queued data commit must never be cancelled.
on:
  schedule:
    # two slots per day: scheduler drift reached 3-9h in late August 2026 and
    # twice pushed the 15:17 run past MEZ midnight, losing that day's slot
    # (2026-08-27). The morning run guarantees a same-day capture; the
    # afternoon run overwrites it with the canonical instant (the snapshot
    # script's same-day upsert is idempotent), and the script's self-heal
    # backfills any day both slots still missed.
    - cron: '17 5 * * *'
    - cron: '17 15 * * *'
  workflow_dispatch:
    # a one-off wide heal for slots older than the REST retention (~30 days),
    # which are reachable only through the ZIP archive. The daily runs keep the
    # defaults: the ZIP path costs a prepare POST per station and would spend
    # 739 of them every day on a hole that may well be unhealable.
    inputs:
      heal_days:
        description: 'Self-heal lookback in days (empty = 7)'
        required: false
        default: ''
      heal_source:
        description: 'Where healed points come from'
        required: false
        default: rest
        type: choice
        options: [rest, zip]

permissions:
  contents: write
  actions: write # to dispatch the pages deploy afterwards
  issues: write # to report a failed run to the data-freshness issue

concurrency:
  group: archive-branch-write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    # one bulk request and a JSON write — a stuck run should fail fast and red.
    # a dispatched run may carry the ZIP heal instead (739 prepare POSTs at
    # pool 2 with a 1.5s throttle ≈ 15-20min), which does not fit in 30.
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 90 || 30 }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          ref: archive
          path: archive-branch
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Snapshot current water levels
        run: |
          node scripts/snapshot-wsv.mjs --out archive-branch/archive/snapshots \
            ${HEAL_DAYS:+--heal-days "$HEAL_DAYS"} --heal-source "${HEAL_SOURCE:-rest}"
        env:
          HEAL_DAYS: ${{ inputs.heal_days }}
          HEAL_SOURCE: ${{ inputs.heal_source }}
      - name: Append today into river totals (?total view)
        # folds the fresh snapshot into the running year's per-river totals —
        # no network (reuses the persisted unit sidecar), stays cheap
        run: node scripts/build-river-totals.mjs --append --archive archive-branch/archive --out archive-branch/archive/totals
      - name: Consistency gate
        # content-level guard before anything is pushed: recency of the month
        # shard (a force-push reset base stays weeks behind), totals really
        # rebuilt this run (the append skips silently without units.json),
        # station coverage, and no regression against the branch HEAD — the
        # failure() step below already reports a red run to the issue
        run: node scripts/check-archive-consistency.mjs --tree archive-branch/archive --git archive-branch
      - name: Commit and push
        id: push
        run: |
          cd archive-branch
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add archive
          git diff --cached --quiet && { echo 'no changes'; exit 0; }
          git commit -m "Snapshot water levels ($(date -u +%Y-%m-%d))"
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"
      - name: Redeploy pages
        # a push to the archive branch cannot trigger pages.yml itself — the
        # orphan data branch carries no workflow files — so dispatch it here
        if: steps.push.outputs.pushed == 'true'
        run: gh workflow run pages.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Report a failed run to the data-freshness issue
        # the timeout above turns a hang into a red run instead of a silent
        # wait — surface it the same way data-freshness.yml would, so a
        # broken daily snapshot is visible without waiting for the 36h
        # staleness check to catch up.
        # `cancelled()` is load-bearing: a timeout ends the run as CANCELLED,
        # not failed, so `failure()` alone never fired for the exact hang this
        # step was written for. The cost is a report on a manual cancel too —
        # GitHub gives both the same conclusion, and a missed hang is worse.
        if: failure() || cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh label create data-freshness --force --color B60205 \
            --description "Data pipeline freshness / failure watchdog" >/dev/null
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          ISSUE_NUM=$(gh issue list --label data-freshness --state open --json number --jq '.[0].number')
          if [ -n "$ISSUE_NUM" ]; then
            gh issue comment "$ISSUE_NUM" --body "snapshot-update run failed: $RUN_URL"
          else
            BODY="The snapshot-update workflow run failed: $RUN_URL"$'\n\n'"This issue was opened automatically and is never closed automatically — close it once the pipeline is confirmed caught up."
            gh issue create --title "Data pipeline stale: snapshot-update run failed" --label data-freshness --body "$BODY"
          fi
