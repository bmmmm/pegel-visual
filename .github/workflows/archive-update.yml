name: archive-update

# Refreshes the running-year WSV archive data on the `archive` branch once a
# month. The --current step pulls the last month from the PEGELONLINE REST
# API (requests 35 days, the server caps at ~31) and upserts them into
# current.json; in January the just-completed year
# is first re-backfilled from the WSV ZIP archive (authoritative; the REST
# accumulation only fills its gaps, and graduates unchanged if the ZIP path
# fails — the gap sweep below then retries) before it freezes into the
# immutable closed.json bundle. A push to the data branch cannot trigger
# pages.yml (the orphan branch carries no workflow files), so the last step
# dispatches the deploy explicitly — the site stays at most one month stale.
on:
  schedule:
    - cron: '23 4 3 * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write # to dispatch the pages deploy afterwards
  issues: write # to report a failed run to the data-freshness issue

# shared with snapshot-update.yml — both push to the `archive` branch, so the
# runs serialize instead of racing (no cancel-in-progress: a queued data
# commit must never be dropped)
concurrency:
  group: archive-branch-write

jobs:
  refresh:
    runs-on: ubuntu-latest
    # a resumability regression once turned the ~30min gap sweep into a full
    # 26-year re-backfill of all 737 stations and silently ate the default 6h
    # cap twice (2026-07-18, 2026-08-03) without ever reaching the push step —
    # fail fast instead so a repeat shows up as a red run, not a missed month.
    # the healthy run takes ~30-40min; 120 leaves headroom for WSV throttling
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          ref: archive
          path: archive-branch
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Fetch current-year data from WSV (REST, last 30 days)
        run: node scripts/fetch-wsv-archive.mjs --current --out archive-branch/archive
      - name: Gap sweep (new stations + retry the none-stations)
        # the plain backfill IS the sweep: stations with a complete meta.json
        # are skipped, stations that never succeeded (newly commissioned, or
        # archive-less so far) get a full 2000->last-year attempt
        run: node scripts/fetch-wsv-archive.mjs --out archive-branch/archive
      - name: Refresh Rijkswaterstaat gauges (running year)
        # the 10 Dutch partner gauges WSV has no archive for are backed by
        # Rijkswaterstaat instead; --current refreshes their running year (in
        # January it also freezes the completed one). Runs after the WSV sweep so
        # its manifest upsert (which carries source:"Rijkswaterstaat") lands last.
        # The one-time 1989-> backfill is seeded separately (see the script header).
        run: node scripts/fetch-rws-archive.mjs --current --out archive-branch/archive
      - name: Rebuild river totals (?total view)
        # aggregates the freshly refreshed per-station files into per-river
        # daily sums (archive/totals/); --fetch-units refreshes the unit
        # sidecar so metre-reporting elevation gauges stay excluded. Runs last
        # so it sees the WSV refresh, the gap sweep and the RWS upsert.
        run: node scripts/build-river-totals.mjs --rebuild --archive archive-branch/archive --out archive-branch/archive/totals --fetch-units
      - name: Consistency gate
        # content-level guard before anything is pushed: recency, totals
        # liveness, station coverage, and no regression against the branch
        # HEAD (deleted files, shrunken closed.json, nulled current.json
        # slots) — the failure() step below already reports a red run
        run: node scripts/check-archive-consistency.mjs --tree archive-branch/archive --git archive-branch
      - name: Commit and push
        id: push
        run: |
          cd archive-branch
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add archive
          git diff --cached --quiet && { echo 'no changes'; exit 0; }
          git commit -m "Refresh current-year archive data ($(date -u +%Y-%m))"
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"
      - name: Redeploy pages
        # a push to the archive branch cannot trigger pages.yml itself — the
        # orphan data branch carries no workflow files — so dispatch it here
        if: steps.push.outputs.pushed == 'true'
        run: gh workflow run pages.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Report a failed run to the data-freshness issue
        # the timeout above turns a hang into a red run instead of a silent
        # 6h wait — surface it the same way data-freshness.yml would, so a
        # broken pipeline is visible without waiting for the 36h staleness
        # check to catch up
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh label create data-freshness --force --color B60205 \
            --description "Data pipeline freshness / failure watchdog" >/dev/null
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          ISSUE_NUM=$(gh issue list --label data-freshness --state open --json number --jq '.[0].number')
          if [ -n "$ISSUE_NUM" ]; then
            gh issue comment "$ISSUE_NUM" --body "archive-update run failed: $RUN_URL"
          else
            BODY="The archive-update workflow run failed: $RUN_URL"$'\n\n'"This issue was opened automatically and is never closed automatically — close it once the pipeline is confirmed caught up."
            gh issue create --title "Data pipeline stale: archive-update run failed" --label data-freshness --body "$BODY"
          fi
