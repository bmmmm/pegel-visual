name: archive-heal

# One-off repair of the `archive` data branch (issue #17), manual only — it is
# a throttled job against the WSV ZIP endpoint, so it runs in a window someone
# chose, never on a schedule:
#
#  - dec31: scripts/heal-dec31.mjs re-reads the Dec 31 that every ZIP request
#    ending at `Y-12-31` flattened to its midnight reading (2143 closed years
#    across 613 stations, measured 2026-09-24). One small request per year;
#    resumable — a healed year no longer matches, so a re-run continues.
#  - running: the monthly --running heal on demand, which re-reads the whole
#    running year from the ZIP. It fills whatever of Jan..May 2026 WSV holds
#    and the file still lacks — measured 2026-09-24 that is little: the
#    first-Monday runs of archive-update.yml already did it for nearly every
#    archived gauge; the remaining holes are mostly gauges with no WSV archive.
#
# The rest mirrors archive-update.yml: totals rebuilt (R2 of the consistency
# gate demands a fresh overview), the gate, one commit, the explicit pages
# dispatch a data-branch push cannot trigger itself.
#
# WHEN to dispatch: this job holds the archive-branch-write group for ~1 h
# (up to budget_minutes). GitHub keeps only ONE pending run per group and
# cancels it silently when another arrives, so a run of snapshot-update.yml
# (05:17 and 15:17 UTC daily) or archive-update.yml (Mon 04:23 UTC) queued
# behind this one can be dropped. Dispatch right after a snapshot run, not on a
# Monday morning — e.g. 06:00 UTC Tue..Sun leaves ~9 h clear.
on:
  workflow_dispatch:
    inputs:
      dec31:
        description: 'Heal the flattened Dec 31 in closed.json (scripts/heal-dec31.mjs)'
        type: boolean
        default: true
      running:
        description: 'Also re-read the running year from the ZIP (fetch-wsv-archive.mjs --running, ~17 min)'
        type: boolean
        default: false
      station:
        description: 'Dec-31 heal for ONE station only (name or uuid) — a probe run; empty = all'
        type: string
        default: ''
      parallel:
        description: 'Dec-31 heal workers (each throttled to one request per ~1.5 s)'
        type: string
        default: '2'
      budget_minutes:
        description: 'Dec-31 heal stops starting requests after this many minutes (max 280); what is healed by then is committed'
        type: string
        default: '240'

permissions:
  contents: write
  actions: write # to dispatch the pages deploy afterwards

# the same group as archive-update.yml and snapshot-update.yml: every writer of
# the `archive` branch serializes instead of racing (see WHEN above for the
# pending-run caveat)
concurrency:
  group: archive-branch-write

jobs:
  heal:
    runs-on: ubuntu-latest
    # budget_minutes (<= 280) + the optional --running pass (~17) + totals + gate
    timeout-minutes: 330
    steps:
      - name: Check the inputs
        # before anything runs: a dispatch with both boxes unticked, or a heal
        # that dies on a mistyped number, would still rebuild the totals and
        # push them as a "heal"; a budget past the job timeout would be cut off
        # before the commit step and lose everything it healed
        env:
          DEC31: ${{ inputs.dec31 }}
          RUNNING: ${{ inputs.running }}
          BUDGET: ${{ inputs.budget_minutes }}
          PARALLEL: ${{ inputs.parallel }}
        run: |
          if [ "$DEC31" != "true" ] && [ "$RUNNING" != "true" ]; then
            echo "::error::nothing to do — tick dec31 and/or running"; exit 1
          fi
          case "$PARALLEL" in ''|*[!0-9]*|0) echo "::error::parallel must be a whole number >= 1"; exit 1 ;; esac
          case "$BUDGET" in ''|*[!0-9]*) echo "::error::budget_minutes must be whole minutes"; exit 1 ;; esac
          if [ "$BUDGET" -lt 1 ] || [ "$BUDGET" -gt 280 ]; then
            echo "::error::budget_minutes must be 1..280 (the job times out at 330)"; exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: archive
          path: archive-branch
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Heal the flattened Dec 31 (WSV ZIP)
        id: heal
        if: inputs.dec31
        # a red fail rate must not throw away the years already healed: each one
        # is written only after its own answer checked out, so the partial tree
        # is still committed — the last step turns the run red afterwards
        continue-on-error: true
        env:
          STATION: ${{ inputs.station }}
          PARALLEL: ${{ inputs.parallel }}
          BUDGET: ${{ inputs.budget_minutes }}
        run: |
          set -- --out archive-branch/archive --parallel "$PARALLEL" --budget-minutes "$BUDGET"
          if [ -n "$STATION" ]; then set -- "$@" --station "$STATION"; fi
          node scripts/heal-dec31.mjs "$@"
      - name: Heal the running year from the WSV ZIP archive
        if: inputs.running
        run: node scripts/fetch-wsv-archive.mjs --running --parallel 2 --out archive-branch/archive
      - name: Rebuild river totals (?total view)
        run: node scripts/build-river-totals.mjs --rebuild --archive archive-branch/archive --out archive-branch/archive/totals --fetch-units
      - name: Consistency gate
        run: node scripts/check-archive-consistency.mjs --tree archive-branch/archive --git archive-branch
      - name: Commit and push
        id: push
        env:
          DEC31: ${{ inputs.dec31 }}
          RUNNING: ${{ inputs.running }}
        run: |
          cd archive-branch
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add archive
          git diff --cached --quiet && { echo 'no changes'; exit 0; }
          what=""
          [ "$DEC31" = "true" ] && what="flattened Dec 31"
          [ "$RUNNING" = "true" ] && what="${what:+$what + }running year"
          git commit -m "Heal archive data: $what"
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"
      - name: Redeploy pages
        # a push to the archive branch cannot trigger pages.yml itself — the
        # orphan data branch carries no workflow files — so dispatch it here
        if: steps.push.outputs.pushed == 'true'
        run: gh workflow run pages.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Fail the run if the Dec-31 heal did
        # continue-on-error above kept the partial result; the run still says so
        if: steps.heal.outcome == 'failure'
        run: |
          echo "::error::the Dec-31 heal step failed (fail rate or bad input) — its partial result was committed above; re-run to continue"
          exit 1
