name: pages

# Deploys the site from main plus the WSV archive data from the `archive`
# branch (data never lives on main — local pushes to main and CI commits to
# the data branch stay out of each other's way).
on:
  # Deploys run AFTER the test suite, not beside it. On `push` the two raced,
  # so a push with failing tests still went live — the tests were a report, not
  # a gate. `workflow_run` fires once `tests` has finished on main; the job's
  # `if` below is what actually refuses a red run.
  workflow_run:
    workflows: [tests]
    types: [completed]
    branches: [main]
    # a push to the `archive` data branch cannot trigger this workflow — the
    # orphan branch carries no workflow files, GitHub evaluates triggers from
    # the pushed commit. archive-update dispatches the deploy explicitly, and
    # that dispatch path is why workflow_dispatch has to stay.
  workflow_dispatch:

# default for the jobs; a job-level `permissions:` block REPLACES this, it does
# not add to it (resolve and deploy each declare their complete set)
permissions:
  contents: read

# One deploy at a time, the newest run wins (its resolve runs last, so it
# deploys the newest green commit). Only a run that will deploy joins `pages`:
# workflow-level concurrency applies before any job `if`, so a red or
# cancelled `tests` run in the shared group cancelled an in-flight deploy (a
# data dispatch, say) and then skipped. Every other run gets a group of its
# own. The condition is resolve's `if`, word for word; change them together.
# Not job-level groups: build and deploy would be separate members, and a
# queued deploy of an older run could cancel a newer run's build.
concurrency:
  group: >-
    ${{ (github.event_name == 'workflow_dispatch' ||
         (github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push'))
        && 'pages' || format('pages-noop-{0}', github.run_id) }}
  cancel-in-progress: true

jobs:
  resolve:
    # a manual or data-pipeline dispatch always deploys (the newest tested main
    # commit); a test run only when it was a green push run. `event == 'push'`
    # matters: `tests` also runs on pull requests, and a fork branch named
    # `main` passes the `branches` filter.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read # to list the `tests` runs
    outputs:
      sha: ${{ steps.tested.outputs.sha }}
    steps:
      - name: Resolve the tested commit
        # Deploy exactly the newest commit with a green `tests` push run on
        # main, for BOTH triggers. Never `main` as it is when this job starts
        # (an untested push landing in between), and never just the run that
        # triggered us: a re-run of an old green run fires workflow_run too,
        # and deploying its head_sha would roll the live site back. The API
        # orders runs by created_at and a re-run keeps its original one, so
        # the first entry is the newest commit, not the newest run.
        # workflow_run whose sha is not that newest green one (a re-run, or
        # a runs list lagging behind the completion event): deploy the newest
        # green one anyway. Skipping was wrong: this run has already joined
        # the `pages` group and may have cancelled the deploy it defers to.
        # workflow_dispatch with main's HEAD still untested: the previous
        # green commit is deployed, and a push gets a workflow_run of its own
        # once its tests finish. A commit merged with GITHUB_TOKEN gets none:
        # dependabot-automerge squash-merges on GitHub, which starts no `push`
        # workflow, so that commit has no tests push run and is deployed only
        # inside the next push to main that goes green.
        id: tested
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          # a transient API failure retries (3 attempts, 10 s then 20 s
          # apart); a persistent one fails the run, it never deploys a guess
          for attempt in 1 2 3; do
            if sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/test.yml/runs?branch=main&event=push&status=success&per_page=1" \
                       --jq '.workflow_runs[0].head_sha // empty'); then
              break
            fi
            [ "$attempt" -lt 3 ] || { echo "::error::listing the tests runs failed $attempt times — refusing to deploy"; exit 1; }
            echo "::warning::listing the tests runs failed (attempt $attempt of 3) — retrying"
            sleep $((attempt * 10))
          done
          [ -n "$sha" ] || { echo "::error::no successful tests run on main — refusing to deploy"; exit 1; }
          if [ -n "$RUN_SHA" ] && [ "$RUN_SHA" != "$sha" ]; then
            echo "::notice::tests run for $RUN_SHA is not the newest green commit — deploying the newest green commit $sha instead"
          fi
          echo "deploying tested commit $sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  build:
    # a resolve that ran always outputs a sha; the guard keeps an empty one
    # from checking out the default ref (deploy is skipped with build)
    needs: resolve
    if: needs.resolve.outputs.sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - name: Assemble site
        run: |
          mkdir /tmp/site
          # The artifact is the SITE, not the checkout. CLAUDE.md was being
          # served at /pegel-visual/CLAUDE.md (200, measured 2026-09-03) and
          # .claude/domains/ would have joined it — agent notes, not assets.
          rsync -a --exclude .git --exclude .github --exclude tests --exclude scripts \
                --exclude .claude --exclude CLAUDE.md ./ /tmp/site/
      - name: Stamp the deployed commit and date
        # the checked-out tested commit's HEAD, not $GITHUB_SHA — for a
        # workflow_run that is the default branch's tip, for a dispatch the
        # ref it was started on; neither need be what is actually deployed.
        # The sitemap's lastmod is the same idea: every URL in it is this one
        # page in a different mode, so its date is simply the deploy's.
        run: |
          set -euo pipefail
          sed -i "s/__COMMIT__/$(git rev-parse --short HEAD)/" /tmp/site/index.html
          sed -i "s/__LASTMOD__/$(date -u +%Y-%m-%d)/g" /tmp/site/sitemap.xml
          ! grep -q '__COMMIT__\|__LASTMOD__' /tmp/site/index.html /tmp/site/sitemap.xml
      - name: Add archive data (when the archive branch exists)
        # "the branch is absent" and "the fetch broke" are different answers and
        # used to share one silent `if git fetch`: a transient failure deployed
        # a site with no data at all, and only data-freshness noticed, hours
        # later. ls-remote answers the first question; once the branch is known
        # to exist, a failed fetch has to stop the deploy.
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin archive >/dev/null; then
            git fetch origin archive --depth 1
            git worktree add /tmp/archive-branch FETCH_HEAD
            cp -R /tmp/archive-branch/archive /tmp/site/archive
          else
            echo "no archive branch on this remote — deploying the site without data"
          fi
      - name: Add LANUK NRW data (when the nrw branch exists)
        # same distinction as above, for the second data branch. Only `nrw`
        # (daily level, ~3.4 MB/year) is mounted; `nrw-hires` (15-minute
        # series, ~75 MB/year) is kept on GitHub and never deployed — that is
        # the whole reason the two are separate branches.
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin nrw >/dev/null; then
            git fetch origin nrw --depth 1
            git worktree add /tmp/nrw-branch FETCH_HEAD
            cp -R /tmp/nrw-branch/nrw /tmp/site/nrw
          else
            echo "no nrw branch on this remote — deploying the site without LANUK data"
          fi
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: /tmp/site

  deploy:
    # Upload and deploy used to share one job, and deploy-pages looked the
    # artifact up a fraction of a second after it was finalized. The listing
    # it uses (ListArtifacts) can lag behind finalize: three runs between
    # 2026-11-20 and 2026-11-23 got "Found 0 artifact(s)" 0.4-0.8 s after
    # "successfully finalized" (actions/deploy-pages#451; deploy-pages does
    # not retry an empty listing). A separate job starts its lookup seconds
    # later — the layout GitHub's own Pages starters use; how long the listing
    # can lag is not documented, so this is not a measured guarantee.
    # "Re-run failed jobs" now runs only this job and finds the build's one
    # artifact, where a re-run of the single job uploaded a second
    # `github-pages` and failed on "Artifact count is 2". That re-run deploys
    # the failed run's build and works only while the artifact is retained
    # (one day): once a newer run has deployed, dispatch a fresh run instead.
    # "Re-run all jobs" still uploads a second artifact and fails.
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
