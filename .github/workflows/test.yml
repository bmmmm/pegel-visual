name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# the deploy runs on this workflow's result (pages.yml, workflow_run), so the
# suite reading the repo is all the access it needs
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node --test
