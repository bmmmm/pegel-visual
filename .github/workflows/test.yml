name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# the deploy runs on this workflow's result (pages.yml, workflow_run), so the
# suite reading the repo is all the access it needs
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node --test

  # the forecast gate's own tests (scripts/forecast): window logic, baselines,
  # the DM/bootstrap statistics, the clause logic on synthetic results and the
  # licence grep. numpy + pytest only — the `model` group (torch, timesfm) is a
  # default group locally but opted out here; nothing in the suite loads weights.
  forecast-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: scripts/forecast
    steps:
      - uses: actions/checkout@v7
      # exact tag: setup-uv stopped publishing floating major tags after v7,
      # `@v10` does not resolve (measured 2026-09-02); Dependabot bumps it
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: scripts/forecast/uv.lock
      - run: uv sync --locked --no-group model
      - run: uv run --no-sync pytest -q

  # the gate page's runtime — focus after a full re-render, open panels, back and
  # forward, the cursor, overflow on a phone — has no DOM in node --test.
  # scripts/gate-check.mjs drives the runner's Chrome over CDP on two viewports
  # and fails on any FAIL line; the deploy waits for it like for the other two.
  gate-page:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node scripts/gate-check.mjs --shots gate-check-shots
        env:
          CHROME: google-chrome
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: gate-check-shots
          path: gate-check-shots
