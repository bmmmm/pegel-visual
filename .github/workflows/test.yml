name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# the deploy runs on this workflow's result (pages.yml, workflow_run), so the
# suite reading the repo is all the access it needs
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node --test

  # the forecast gate's own tests (scripts/forecast): window logic, baselines,
  # the DM/bootstrap statistics, the clause logic on synthetic results and the
  # licence grep. numpy + pytest only — the model extra (torch, timesfm) is not
  # installed here; nothing in the suite loads the weights.
  forecast-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: scripts/forecast
    steps:
      - uses: actions/checkout@v7
      # exact tag: setup-uv stopped publishing floating major tags after v7,
      # `@v10` does not resolve (measured 2026-09-02); Dependabot bumps it
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: scripts/forecast/uv.lock
      - run: uv sync --locked --group dev
      - run: uv run pytest -q
