name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# the deploy runs on this workflow's result (pages.yml, workflow_run), so the
# suite reading the repo is all the access it needs
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node --test

  # the forecast gate's own tests (scripts/forecast): window logic, baselines,
  # the DM/bootstrap statistics, the clause logic on synthetic results and the
  # licence grep. numpy + pytest only — the `model` group (torch, timesfm) is a
  # default group locally but opted out here; nothing in the suite loads weights.
  forecast-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: scripts/forecast
    steps:
      - uses: actions/checkout@v7
      # exact tag: setup-uv stopped publishing floating major tags after v7,
      # `@v10` does not resolve (measured 2026-09-02); Dependabot bumps it
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: scripts/forecast/uv.lock
      - run: uv sync --locked --no-group model
      - run: uv run --no-sync pytest -q

  # What has no DOM in node --test: the gate page's runtime (focus after a full
  # re-render, open panels, back and forward, the cursor, overflow on a phone),
  # and the start page's — above all whether it repaints at all, since
  # scheduleRender() rides on rAF and the Node harness stubs that to a no-op, so
  # a loader that forgot it passes there and ships a page stuck on "loading…".
  # Both drive the runner's Chrome over CDP and fail on any FAIL line; the deploy
  # waits for this workflow like for the other two jobs.
  #
  # One job, two steps: Chrome is already installed here, and a second job would
  # spend ~40 s on checkout and setup-node to save ~30 s of wall clock. Split
  # them when the pair passes about four minutes.
  gate-page:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node scripts/gate-check.mjs --shots tmp-browser-shots/gate
        env:
          CHROME: google-chrome
      # runs even when the gate check failed: two independent pages, and one red
      # run should say everything it knows rather than stopping at the first
      - if: ${{ !cancelled() }}
        run: node scripts/home-check.mjs --shots tmp-browser-shots/home
        env:
          CHROME: google-chrome

      # The station PRECIPITATION/RESPONSE plates and ?rain. Unlike the two
      # above these need DATA, so the `nrw` branch is mounted the way pages.yml
      # mounts it — and the precip product is REBUILT from that tree first.
      # Rebuilding is the point: it makes this check a function of (this
      # commit's code + the branch's raw data), so the run that changes the
      # assignment rule is checked against what that rule produces, not against
      # whatever the last collector run happened to bake.
      #
      # Until 2026-09-08 verify-precip.mjs ran in no workflow at all — the
      # plates it covers were verified by hand and then by nobody. A check that
      # only a human remembers to run is not a check.
      - name: Mount the nrw data branch (skips loudly when there is none)
        if: ${{ !cancelled() }}
        id: nrw
        run: |
          if git ls-remote --exit-code --heads origin nrw >/dev/null; then
            git fetch origin nrw --depth 1
            git worktree add /tmp/nrw-branch FETCH_HEAD
            cp -R /tmp/nrw-branch/nrw ./nrw
            node scripts/build-nrw-precip.mjs --tree nrw
            echo 'have=yes' >> "$GITHUB_OUTPUT"
          else
            echo 'have=no' >> "$GITHUB_OUTPUT"
            echo '::warning::no nrw branch on this remote — the PRECIPITATION/RESPONSE and ?rain plates were NOT verified in a browser on this run'
          fi
      - if: ${{ !cancelled() && steps.nrw.outputs.have == 'yes' }}
        run: node scripts/verify-precip.mjs --shots tmp-browser-shots/precip
        env:
          CHROME: google-chrome

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-check-shots
          path: tmp-browser-shots
