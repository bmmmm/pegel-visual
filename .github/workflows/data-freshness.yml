name: data-freshness

# Watchdog for the data pipeline: archive-update.yml (weekly + monthly) and
# snapshot-update.yml (daily) both push to the orphan `archive` branch, and a
# push to that branch cannot trigger any workflow itself — so if either job
# silently stops running (schedule disabled, token expiry, a hung run eating
# its timeout unnoticed) nothing else would ever say so. This runs a few
# hours after the daily snapshot slot and checks (a) how old the archive
# branch's last commit is (past 36h = stale), (b) whether the DEPLOYED
# site's overview.json is more than 6h behind that commit — the branch can be
# healthy while the pages dispatch never happened, and nothing else notices a
# repaired branch that never reached the site —, (c) the archive refresh's
# own heartbeat (manifest.json age, 10 d), its separate full monthly pass
# checkpoint, and (d) the LANUK NRW mirror's `nrw` branch (daily; 30 h).
# Findings have stable IDs: only a changed set or recovery opens/comments
# on the shared data-freshness issue; increasing ages alone stay quiet. It never
# closes issues itself — closing the loop once the pipeline has caught up is
# a manual step.

on:
  schedule:
    - cron: '47 19 * * *'
  workflow_dispatch:

permissions:
  issues: write
  contents: read

# two overlapping runs (a dispatch during the schedule) would comment the same
# finding twice on the tracking issue
concurrency:
  group: data-freshness
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Check freshness and report only state changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-data-freshness.mjs
