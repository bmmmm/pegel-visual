# `cooldown` is spelled out in every block although 3 days is also the default
# since 2026-07-14: it is the same 3 days the pnpm side of this house pins as
# `minimumReleaseAge: 4320`, and a supply-chain policy that only holds while a
# vendor default happens to agree with it is not a policy. It delays VERSION
# updates only — "Security updates still open immediately, so critical fixes
# are never delayed" (GitHub changelog) — so nothing here slows a CVE down.
version: 2
updates:
  # Grouped, all update types: these arrive in a monthly herd (five at once in
  # 2026-09) and are homogeneous — every one is an Action pin, judged the same
  # way, adopted in one merge. A grouped PR is still a SINGLE head commit, so
  # the adoption path (merge the PR's own commit, push both remotes, GitHub
  # marks it merged) is unchanged. npm and uv below stay ungrouped on purpose:
  # there a version number carries meaning worth its own decision.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore(deps)
    labels:
      - dependencies
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore(deps)
    labels:
      - dependencies
    cooldown:
      default-days: 3

  # the forecast gate (scripts/forecast, uv-managed). BOTH timesfm pins are
  # frozen: 2.0.2 runs the shipped 2.5 weights, 3.0.1 the non-commercial 3.0
  # line that is measured but never shipped. Neither is a dependency to keep
  # fresh — they are pre-registered experiment parameters, and moving one
  # invalidates the report measured with it. A bump belongs in a deliberate
  # re-run, never in an automated PR. See scripts/forecast/pyproject.toml.
  #
  # The BARE `dependency-name` below is the deliberate form, not an oversight.
  # Adding `update-types:` would fence the rule out of the security path —
  # "update-types only affects version updates, not security updates. Security
  # updates will always be created regardless" (GitHub docs, controlling-
  # dependencies-updated) — and a security PR against a frozen experiment
  # parameter is still an automated bump this pin must not get. Nothing is lost
  # by it: Dependabot ALERTS come from the dependency graph and no dependabot.yml
  # key can switch them off, so an advisory still shows up. Only the automatic
  # fix PR is suppressed, which is exactly the intent above.
  - package-ecosystem: uv
    directory: /scripts/forecast
    schedule:
      interval: monthly
    commit-message:
      prefix: chore(deps)
    labels:
      - dependencies
    cooldown:
      default-days: 3
    ignore:
      - dependency-name: timesfm
